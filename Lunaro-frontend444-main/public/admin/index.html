<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Lunaro Control Center</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{color-scheme:dark;--bg:#080d17;--panel:#101a2a;--line:#24334a;--muted:#9aabc1;--gold:#c9a86a;--green:#4bd3a0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#17283d 0,transparent 40%),var(--bg);color:#edf3fb;font-family:Cairo,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1440px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:26px}.brand{font-weight:800;letter-spacing:3px;font-size:21px}.brand small{display:block;letter-spacing:0;color:var(--muted);font-size:12px}.pill{border:1px solid var(--line);border-radius:30px;padding:7px 13px;color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:240px 1fr;gap:20px}.side,.panel,.login{background:#101a2aeb;border:1px solid var(--line);border-radius:18px;box-shadow:0 20px 60px #0003}.side{padding:14px;height:max-content;position:sticky;top:20px}.side button{display:block;width:100%;text-align:right;border:0;background:transparent;color:#b6c4d7;padding:12px;border-radius:10px;margin:3px 0}.side button.active,.side button:hover{background:#1b2a40;color:#fff}.side button.active{border-right:3px solid var(--gold)}.panel{padding:26px;min-height:550px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{margin:0;font-size:23px}.muted{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat{background:#142238;border:1px solid var(--line);padding:16px;border-radius:13px}.stat b{font-size:24px;display:block}.stat span{color:var(--muted);font-size:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;color:#c7d3e2}.field input,.field textarea,.field select{width:100%;background:#091321;border:1px solid #2b3c55;border-radius:9px;color:#fff;padding:11px;outline:none}.field textarea{min-height:90px;resize:vertical}.field input:focus,.field textarea:focus{border-color:var(--gold)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:1px solid var(--line);background:#1a2b42;color:#fff;border-radius:9px;padding:10px 16px}.btn.primary{background:linear-gradient(120deg,#b99455,#e0c58c);color:#101723;border:0;font-weight:800}.btn.danger{color:#ff9d9d;border-color:#74444a;background:#351d27}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.item{display:flex;gap:12px;align-items:center;justify-content:space-between;background:#0c1726;border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.item .meta{min-width:0}.item b{display:block}.item small{color:var(--muted)}.empty{padding:30px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.notice{padding:12px 15px;border-radius:10px;background:#142b2a;color:#9de5c6;margin:12px 0}.hidden{display:none!important}.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}.login{width:min(430px,100%);padding:32px}.login h1{margin:0 0 5px}.login .btn{width:100%;margin-top:10px}.toggle{display:flex;align-items:center;gap:9px}.upload{border:1px dashed #52637c;padding:16px;border-radius:12px;text-align:center;color:var(--muted)}.upload input{max-width:100%}code{color:#e4c88e}@media(max-width:850px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.shell{padding:14px}.panel{padding:17px}.grid2{grid-template-columns:1fr}}
</style></head><body><div id="login" class="login-wrap"><form class="login" id="loginForm"><div class="brand">LUNARO<small>CONTROL CENTER</small></div><h1 style="margin-top:28px">تسجيل الدخول</h1><p class="muted">لوحة الإدارة الخاصة بموقع لونارو</p><div class="field"><label>كلمة مرور الإدارة</label><input id="password" type="password" autocomplete="current-password" required placeholder="أدخل كلمة المرور"></div><p id="loginError" class="muted"></p><button class="btn primary">دخول آمن</button></form></div><div id="app" class="shell hidden"><header class="top"><div class="brand">LUNARO<small>CONTENT CONTROL CENTER</small></div><div style="display:flex;gap:9px;align-items:center"><span class="pill">● متصل بنظام التخزين</span><button class="btn" id="logout">خروج</button></div></header><div class="layout"><aside class="side" id="nav"><button class="active" data-tab="home">نظرة عامة</button><button data-tab="projects">المشاريع</button><button data-tab="sections">الأقسام والمحتوى</button><button data-tab="offers">العروض</button><button data-tab="links">الروابط والأيقونات</button><button data-tab="music">الموسيقى</button><button data-tab="theme">الثيم و CSS</button><button data-tab="settings">نسخ المحتوى</button></aside><main class="panel"><div class="head"><div><h1 id="title">نظرة عامة</h1><div class="muted">تحكم في محتوى الموقع المنشور</div></div><button class="btn primary" id="save">حفظ ونشر التغييرات</button></div><div id="message"></div><div id="content"></div></main></div></div><script>
const $=s=>document.querySelector(s);let state={projects:[],sections:[],links:[],offers:[],music:{enabled:false,url:'',title:''},theme:{cssUrl:'',name:'Default'}},tab='home';const titles={home:'نظرة عامة',projects:'إدارة المشاريع',sections:'الأقسام والمحتوى',offers:'العروض والإعلانات',links:'الروابط والأيقونات',music:'الموسيقى',theme:'مدير الثيمات وملفات CSS',settings:'إعدادات ونسخ المحتوى'};async function api(url,opts={}){const r=await fetch(url,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'حدث خطأ');return d}function msg(t,bad=false){$('#message').innerHTML=`<div class="notice" style="${bad?'background:#351d27;color:#ffb6b6':''}">${t}</div>`;setTimeout(()=>$('#message').innerHTML='',4500)}async function load(){state=await api('/api/state');state.projects??=[];state.sections??=[];state.links??=[];state.offers??=[];state.music??={enabled:false,url:'',title:''};state.theme??={cssUrl:'',name:'Default'}}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function field(label,key,value='',type='text'){return `<div class="field"><label>${label}</label><input data-field="${key}" type="${type}" value="${esc(value)}"></div>`}function textarea(label,key,value=''){return `<div class="field"><label>${label}</label><textarea data-field="${key}">${esc(value)}</textarea></div>`}function upload(label,accept,key){return `<div class="field"><label>${label}</label><div class="upload"><input type="file" accept="${accept}" data-upload="${key}"><div class="muted">يتم رفع الملف إلى Vercel Blob</div></div></div>`}function list(items,type){return items.length?items.map((x,i)=>`<div class="item"><div class="meta"><b>${esc(x.title||x.name||'بدون عنوان')}</b><small>${esc(x.description||x.url||x.category||'')}</small></div><div class="actions"><button class="btn" data-edit="${type}" data-index="${i}">تعديل</button><button class="btn danger" data-delete="${type}" data-index="${i}">حذف</button></div></div>`).join(''):'<div class="empty">لا توجد عناصر حتى الآن. أضف أول عنصر من النموذج.</div>'}function render(){ $('#title').textContent=titles[tab];$('#save').classList.toggle('hidden',tab==='home');let html='';if(tab==='home'){html=`<div class="stats"><div class="stat"><b>${state.projects.length}</b><span>مشروع</span></div><div class="stat"><b>${state.sections.length}</b><span>قسم إضافي</span></div><div class="stat"><b>${state.offers.length}</b><span>عرض منشور</span></div><div class="stat"><b>${state.links.length}</b><span>رابط مخصص</span></div></div><div class="notice">كل ما تحفظ التغييرات سيتم تخزينها في Vercel Blob وتظهر لزوار الموقع بعد تحديث البيانات.</div><h3>آخر تحديث</h3><p class="muted">${state.updatedAt?new Date(state.updatedAt).toLocaleString('ar-EG'):'لم يتم الحفظ بعد'}</p><p class="muted">ابدأ بإضافة مشاريعك الحقيقية؛ معرض الأعمال الافتراضي تمت إزالته من العرض.</p>`}if(tab==='projects'){html=`<h3>إضافة مشروع</h3><div class="grid2">${field('اسم المشروع','p-title')}${field('التصنيف','p-category')}${field('رابط الصورة (أو ارفع صورة)','p-image')}${field('رابط المشروع','p-url')}</div>${upload('صورة المشروع','image/*','p-image')}${textarea('وصف المشروع','p-description')}<div class="actions"><button class="btn primary" id="addProject">إضافة المشروع</button></div><hr style="border-color:var(--line);margin:25px 0"><h3>المشاريع الحالية</h3>${list(state.projects,'projects')}`}if(tab==='sections'){html=`<h3>إضافة قسم مخصص للموقع</h3>${field('عنوان القسم','s-title')}${field('عنوان فرعي (اختياري)','s-subtitle')}${textarea('محتوى القسم','s-body')}<div class="actions"><button class="btn primary" id="addSection">إضافة القسم</button></div><hr style="border-color:var(--line);margin:25px 0"><h3>الأقسام المضافة</h3>${list(state.sections,'sections')}`}if(tab==='offers'){html=`<h3>إنشاء عرض</h3>${field('عنوان العرض','o-title')}${textarea('تفاصيل العرض','o-description')}<div class="grid2">${field('نص الزر','o-button')}${field('رابط الزر','o-url')}</div><div class="actions"><button class="btn primary" id="addOffer">إضافة العرض</button></div><hr style="border-color:var(--line);margin:25px 0"><h3>العروض الحالية</h3>${list(state.offers,'offers')}`}if(tab==='links'){html=`<h3>إضافة رابط أو أيقونة</h3><div class="grid2">${field('اسم الرابط','l-title')}${field('الأيقونة (اسم/رمز)','l-icon')}${field('الرابط URL','l-url')}${field('مكان العرض (اختياري)','l-location')}</div><div class="actions"><button class="btn primary" id="addLink">إضافة الرابط</button></div><hr style="border-color:var(--line);margin:25px 0"><h3>الروابط الحالية</h3>${list(state.links,'links')}`}if(tab==='music'){html=`<h3>إعداد الموسيقى الخلفية</h3><label class="toggle"><input type="checkbox" id="musicEnabled" ${state.music.enabled?'checked':''}> تفعيل مشغل الموسيقى</label>${field('عنوان المقطع','m-title',state.music.title)}${field('رابط ملف الموسيقى','m-url',state.music.url,'url')}${upload('أو ارفع ملف MP3 / WAV','audio/*','m-url')}<p class="muted">المتصفح قد يمنع التشغيل التلقائي بالصوت؛ سيظهر مشغل واضح للزائر ليبدأ التشغيل بنفسه.</p>`}if(tab==='theme'){html=`<h3>رفع ثيم CSS</h3>${field('اسم الثيم','t-name',state.theme.name)}${field('رابط ملف CSS الحالي','t-url',state.theme.cssUrl,'url')}${upload('رفع ملف CSS','text/css,.css','t-url')}<div class="actions"><button class="btn" id="clearTheme">إزالة الثيم المخصص</button></div><div class="notice">ملفات CSS المرفوعة يتم ربطها بالموقع كملف خارجي بعد الحفظ. لا ترفع ملفات HTML أو JavaScript هنا. اختبر الثيم أولاً على نسخة تجريبية لأن CSS غير المناسب قد يؤثر على شكل الصفحات.</div>`}if(tab==='settings'){html=`<h3>تصدير / استيراد محتوى الموقع</h3><p class="muted">احتفظ بنسخة JSON من المحتوى أو استعد نسخة سابقة.</p><div class="actions"><button class="btn" id="export">تنزيل نسخة احتياطية JSON</button><label class="btn">استيراد نسخة JSON <input id="import" type="file" accept="application/json" hidden></label></div>${textarea('بيانات الموقع (JSON)','raw',JSON.stringify(state,null,2))}<div class="actions"><button class="btn" id="applyJson">تحميل JSON إلى المحرر</button></div>`}$('#content').innerHTML=html;bind()}
async function fileUpload(input,key){const f=input.files[0];if(!f)return;if(f.size>8*1024*1024)throw Error('الحد الأقصى لحجم الملف 8MB');const data=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)});const d=await api('/api/upload',{method:'POST',body:JSON.stringify({name:f.name,type:f.type||'text/css',data})});const target=document.querySelector(`[data-field="${key}"]`);if(target)target.value=d.url;else if(key==='p-image')document.querySelector('[data-field="p-image"]').value=d.url;msg('تم رفع الملف بنجاح')}
function bind(){document.querySelectorAll('[data-upload]').forEach(x=>x.onchange=()=>fileUpload(x,x.dataset.upload).catch(e=>msg(e.message,true)));const val=k=>document.querySelector(`[data-field="${k}"]`)?.value?.trim()||'';const add=(arr,obj)=>{if(!obj.title)throw Error('اكتب العنوان أولاً');arr.push(obj);render()};$('#addProject')?.addEventListener('click',()=>{try{add(state.projects,{id:crypto.randomUUID(),title:val('p-title'),name:val('p-title'),category:val('p-category'),image:val('p-image'),url:val('p-url'),description:val('p-description')})}catch(e){msg(e.message,true)}});$('#addSection')?.addEventListener('click',()=>{try{add(state.sections,{id:crypto.randomUUID(),title:val('s-title'),subtitle:val('s-subtitle'),body:val('s-body')})}catch(e){msg(e.message,true)}});$('#addOffer')?.addEventListener('click',()=>{try{add(state.offers,{id:crypto.randomUUID(),title:val('o-title'),description:val('o-description'),button:val('o-button'),url:val('o-url')})}catch(e){msg(e.message,true)}});$('#addLink')?.addEventListener('click',()=>{try{add(state.links,{id:crypto.randomUUID(),title:val('l-title'),icon:val('l-icon'),url:val('l-url'),location:val('l-location')})}catch(e){msg(e.message,true)}});$('#musicEnabled')?.addEventListener('change',e=>state.music.enabled=e.target.checked);$('#clearTheme')?.addEventListener('click',()=>{state.theme={cssUrl:'',name:'Default'};render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('تأكيد حذف العنصر؟')){state[b.dataset.delete].splice(+b.dataset.index,1);render()}});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const arr=state[b.dataset.edit],i=+b.dataset.index,x=arr[i];const raw=prompt('يمكنك تعديل جميع بيانات العنصر بصيغة JSON',JSON.stringify(x,null,2));if(raw!==null){try{const updated=JSON.parse(raw);arr[i]={...x,...updated};render()}catch{msg('صيغة JSON غير صحيحة',true)}}});$('#export')?.addEventListener('click',()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.download='lunaro-content-backup.json';a.click();URL.revokeObjectURL(a.href)});$('#import')?.addEventListener('change',async e=>{try{const f=e.target.files[0];const j=JSON.parse(await f.text());state={...state,...j};render();msg('تم تحميل النسخة؛ اضغط حفظ ونشر لاعتمادها')}catch{msg('ملف JSON غير صالح',true)}});$('#applyJson')?.addEventListener('click',()=>{try{state=JSON.parse(val('raw'));render();msg('تم تحميل البيانات')}catch{msg('صيغة JSON غير صحيحة',true)}})}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';try{await api('/api/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});await enter()}catch(err){$('#loginError').textContent=err.message}};async function enter(){await load();$('#login').classList.add('hidden');$('#app').classList.remove('hidden');render()}$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST',body:'{}'});location.reload()};$('#nav').onclick=e=>{const b=e.target.closest('button[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('#nav button').forEach(x=>x.classList.toggle('active',x===b));render()};$('#save').onclick=async()=>{try{state.music.title=document.querySelector('[data-field="m-title"]')?.value??state.music.title;state.music.url=document.querySelector('[data-field="m-url"]')?.value??state.music.url;state.theme.name=document.querySelector('[data-field="t-name"]')?.value??state.theme.name;state.theme.cssUrl=document.querySelector('[data-field="t-url"]')?.value??state.theme.cssUrl;await api('/api/save',{method:'POST',body:JSON.stringify(state)});msg('تم حفظ ونشر التغييرات بنجاح')}catch(e){msg(e.message,true)}};api('/api/session').then(async()=>{await enter()}).catch(()=>{});
</script></body></html>
